[package]
name = "machine-party-mod-manager"
version = "0.2.7"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
steamlocate = "2"
futures-util = "0.3"
fs2 = "0.4"
file-id = "0.2"
tempfile = "3"
zip = { version = "9.7", default-features = false }
crc32fast = "1"
flate2 = "1"
minisign-verify = "0.3"
base64 = "0.23"
hex = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.11"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
