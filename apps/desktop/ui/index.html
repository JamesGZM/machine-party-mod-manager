<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="images/logo.svg" />
    <title>Machine Party 模组管理器</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand" aria-label="Machine Party 模组管理器">
        <img src="images/logo.svg" alt="" />
        <div><b>MACHINE PARTY</b><small>模组管理器</small></div>
      </div>
      <nav class="nav">
        <button class="nav-item" data-page="catalog" data-icon="catalog"><span class="nav-label">模组目录</span></button>
        <button class="nav-item" data-page="installed" data-icon="installed"><span class="nav-label">已安装</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-page="settings" data-icon="settings"><span class="nav-label">设置</span></button>
      </div>
    </aside>
    <main>
      <header class="page-head">
        <div>
          <div class="page-title">
            <h1></h1>
            <button id="refresh-catalog" class="btn btn-ghost btn-icon" data-icon="refresh" hidden></button>
          </div>
          <p id="subtitle"></p>
        </div>
        <div class="head-tools">
          <div class="ops" id="batch-ops" hidden>
            <button id="batch-toggle" class="btn btn-secondary ops-toggle" type="button"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="batch-menu">
              <span data-i18n="batchActions">操作</span>
            </button>
            <div class="ops-menu" id="batch-menu" role="menu" aria-label="操作">
              <div class="ops-menu-inner">
                <button class="ops-item" type="button" role="menuitem" data-kind="install">
                  <span class="ops-icon" data-icon="download"></span>
                  <span class="ops-label">
                    <b data-i18n="batchInstall">一键安装</b>
                    <small data-i18n="batchInstallHint">安装尚未安装的模组</small>
                  </span>
                  <span class="ops-count" id="ops-count-install">0</span>
                </button>
                <button class="ops-item" type="button" role="menuitem" data-kind="update">
                  <span class="ops-icon" data-icon="refresh"></span>
                  <span class="ops-label">
                    <b data-i18n="batchUpdate">一键更新</b>
                    <small data-i18n="batchUpdateHint">更新已安装且有新版的模组</small>
                  </span>
                  <span class="ops-count" id="ops-count-update">0</span>
                </button>
                <button class="ops-item" type="button" role="menuitem" data-kind="uninstall">
                  <span class="ops-icon" data-icon="close"></span>
                  <span class="ops-label">
                    <b data-i18n="batchUninstall">一键卸载</b>
                    <small data-i18n="batchUninstallHint">卸载由管理器安装的模组</small>
                  </span>
                  <span class="ops-count" id="ops-count-uninstall">0</span>
                </button>
              </div>
            </div>
          </div>
          <label id="search" class="field search" data-icon="search">
            <input type="search" placeholder="搜索模组名称" aria-label="搜索模组" />
          </label>
        </div>
      </header>
      <div id="content"></div>
    </main>
    <dialog class="dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button id="close" class="btn btn-ghost btn-icon" aria-label="关闭" data-icon="close"></button>
      </div>
      <div id="dialogBody" class="dialog-body"></div>
    </dialog>
  </body>
</html>
